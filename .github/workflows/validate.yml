name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run catalog validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate example catalog
        run: python scripts/validate_catalog.py catalog/catalog.example.json
